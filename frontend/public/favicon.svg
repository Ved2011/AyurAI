<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E19" />
      <stop offset="100%" stop-color="#243429" />
    </linearGradient>

    <!-- Gold Lotus Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9E7D3B" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#F3E5AB" />
    </linearGradient>

    <!-- Emerald Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#264A31" />
      <stop offset="60%" stop-color="#4A7C59" />
      <stop offset="100%" stop-color="#7DB88A" />
    </linearGradient>

    <!-- Nectar Glow Gradient -->
    <radialGradient id="nectarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF9E6" />
      <stop offset="70%" stop-color="#E5C378" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Rounded Shield / Tile -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#3E6B4A" stroke-width="1.5" />

  <!-- Outer Lotus Aura Ring -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#D4AF37" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.45" />

  <!-- Classical Lotus Petals (Left & Right) -->
  <path d="M 14 38 C 14 26, 24 24, 32 36 C 24 37, 18 42, 14 38 Z" fill="url(#goldGrad)" opacity="0.8" />
  <path d="M 50 38 C 50 26, 40 24, 32 36 C 40 37, 46 42, 50 38 Z" fill="url(#goldGrad)" opacity="0.8" />

  <!-- Outer Base Petals -->
  <path d="M 20 44 C 24 49, 40 49, 44 44 C 38 43, 26 43, 20 44 Z" fill="#9E7D3B" opacity="0.7" />

  <!-- Sacred Medicinal Herbal Leaf (Tulsi / Neem) -->
  <path d="M 32 10 C 22 20, 20 36, 32 48 C 44 36, 42 20, 32 10 Z" fill="url(#leafGrad)" />

  <!-- Central Leaf Vein (Srotas) -->
  <path d="M 32 12 Q 32 30, 32 46" fill="none" stroke="#A3D9AE" stroke-width="1.5" stroke-linecap="round" />
  
  <!-- Lateral Side Veins -->
  <path d="M 32 22 Q 27 24, 25 28" fill="none" stroke="#A3D9AE" stroke-width="0.9" stroke-linecap="round" opacity="0.85" />
  <path d="M 32 22 Q 37 24, 39 28" fill="none" stroke="#A3D9AE" stroke-width="0.9" stroke-linecap="round" opacity="0.85" />
  <path d="M 32 30 Q 26 33, 24 37" fill="none" stroke="#A3D9AE" stroke-width="0.9" stroke-linecap="round" opacity="0.85" />
  <path d="M 32 30 Q 38 33, 40 37" fill="none" stroke="#A3D9AE" stroke-width="0.9" stroke-linecap="round" opacity="0.85" />

  <!-- Amrita / Ojas Droplet at Peak of Healing Leaf -->
  <ellipse cx="32" cy="18" rx="3.5" ry="5" fill="url(#nectarGlow)" />
  <circle cx="32" cy="17" r="1.5" fill="#FFFFFF" opacity="0.9" />

  <!-- Golden Kalasha Base Accent -->
  <circle cx="32" cy="49" r="2.5" fill="url(#goldGrad)" />
</svg>
